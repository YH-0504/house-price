<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>房仲車位單價計算器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-calculator text-xl text-yellow-300"></i>
                <h1 class="text-lg font-bold tracking-wide">房仲實價拆算車位工具</h1>
            </div>
            <span class="text-xs bg-blue-700 text-blue-100 px-2.5 py-1 rounded-full font-medium">永康/東橋專用</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto w-full px-4 py-5 flex-1">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 space-y-5">
            
            <!-- 1. 選擇大樓 -->
            <div>
                <label for="building-select" class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center">
                    <i class="fa-solid fa-building text-blue-500 mr-1.5"></i> 選擇大樓社區
                </label>
                <div class="relative">
                    <select id="building-select" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-base rounded-xl px-3.5 py-2.5 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition appearance-none font-medium">
                        <!-- 由 JS 動態注入選項 -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </div>
                </div>
            </div>

            <!-- 2. 車位類型（平面 vs 機械） -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center">
                    <i class="fa-solid fa-square-parking text-blue-500 mr-1.5"></i> 車位型態
                </label>
                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button" id="btn-plane" onclick="setParkingType('plane')" class="flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition shadow-sm bg-blue-50 border-blue-500 text-blue-700">
                        <i class="fa-solid fa-car mr-1.5"></i> 平面車位 (150萬)
                    </button>
                    <button type="button" id="btn-mechanical" onclick="setParkingType('mechanical')" class="flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition bg-white border-slate-200 text-slate-600 hover:bg-slate-50">
                        <i class="fa-solid fa-gears mr-1.5"></i> 機械車位 (100萬)
                    </button>
                </div>
            </div>

            <!-- 3. 車位坪數規格快速切換 -->
            <div id="sub-parking-container">
                <label class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center justify-between">
                    <span><i class="fa-solid fa-tags text-blue-500 mr-1.5"></i> 車位規格種類</span>
                    <span class="text-xs text-slate-400 font-normal">點選帶入坪數</span>
                </label>
                <div id="sub-parking-buttons" class="flex flex-wrap gap-2">
                    <!-- 由 JS 動態產生多規格按鈕 -->
                </div>
            </div>

            <!-- 4. 數值輸入區（兩欄並排，已加入純數字小數點鍵盤支援） -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <div>
                    <label for="total-price" class="block text-xs font-bold text-slate-600 mb-1">總價格 (萬元)</label>
                    <div class="relative">
                        <input type="number" inputmode="decimal" id="total-price" placeholder="例如: 1580" step="any" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" oninput="calculate()">
                    </div>
                </div>

                <div>
                    <label for="total-area" class="block text-xs font-bold text-slate-600 mb-1">總坪數 (含車位)</label>
                    <div class="relative">
                        <input type="number" inputmode="decimal" id="total-area" placeholder="例如: 45.2" step="any" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" oninput="calculate()">
                    </div>
                </div>

                <div>
                    <label for="parking-price" class="block text-xs font-bold text-slate-600 mb-1">車位價格 (萬元)</label>
                    <input type="number" inputmode="decimal" id="parking-price" value="150" step="any" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" oninput="calculate()">
                </div>

                <div>
                    <label for="parking-area" class="block text-xs font-bold text-slate-600 mb-1">車位坪數 (坪)</label>
                    <input type="number
