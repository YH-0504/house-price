<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>房仲實價拆算車位工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* 移除預設微調按鈕避免擠壓版面 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-calculator text-xl text-yellow-300"></i>
                <h1 class="text-lg font-bold tracking-wide">房仲實價拆算車位工具</h1>
            </div>
            <span class="text-xs bg-blue-700 text-blue-100 px-2.5 py-1 rounded-full font-medium">永康/東橋專用</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto w-full px-4 py-5 flex-1">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 space-y-5">
            
            <!-- 1. 選擇大樓 -->
            <div>
                <label for="building-select" class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center">
                    <i class="fa-solid fa-building text-blue-500 mr-1.5"></i> 選擇大樓社區
                </label>
                <div class="relative">
                    <select id="building-select" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-base rounded-xl px-3.5 py-2.5 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition appearance-none font-medium">
                        <!-- 由 JS 動態注入選項 -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </div>
                </div>
            </div>

            <!-- 2. 車位類型（平面 vs 機械） -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center">
                    <i class="fa-solid fa-square-parking text-blue-500 mr-1.5"></i> 車位型態
                </label>
                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button" id="btn-plane" onclick="setParkingType('plane')" class="flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition shadow-sm bg-blue-50 border-blue-500 text-blue-700">
                        <i class="fa-solid fa-car mr-1.5"></i> 平面車位 (150萬)
                    </button>
                    <button type="button" id="btn-mechanical" onclick="setParkingType('mechanical')" class="flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition bg-white border-slate-200 text-slate-600 hover:bg-slate-50">
                        <i class="fa-solid fa-gears mr-1.5"></i> 機械車位 (100萬)
                    </button>
                </div>
            </div>

            <!-- 3. 車位坪數規格快速切換 -->
            <div id="sub-parking-container">
                <label class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center justify-between">
                    <span><i class="fa-solid fa-tags text-blue-500 mr-1.5"></i> 車位規格種類</span>
                    <span class="text-xs text-slate-400 font-normal">點選帶入坪數</span>
                </label>
                <div id="sub-parking-buttons" class="flex flex-wrap gap-2">
                    <!-- 由 JS 動態產生多規格按鈕 -->
                </div>
            </div>

            <!-- 4. 數值輸入區（嚴格鎖定 iOS/Android 純數字帶小數點鍵盤） -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <div>
                    <label for="total-price" class="block text-xs font-bold text-slate-600 mb-1">總價格 (萬元)</label>
                    <div class="relative">
                        <input type="text" 
                               inputmode="decimal" 
                               pattern="[0-9]*[.]?[0-9]*" 
                               id="total-price" 
                               placeholder="例如: 1500" 
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                               oninput="handleNumericInput(this); calculate();">
                    </div>
                </div>

                <div>
                    <label for="total-area" class="block text-xs font-bold text-slate-600 mb-1">總坪數 (含車位)</label>
                    <div class="relative">
                        <input type="text" 
                               inputmode="decimal" 
                               pattern="[0-9]*[.]?[0-9]*" 
                               id="total-area" 
                               placeholder="例如: 42" 
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                               oninput="handleNumericInput(this); calculate();">
                    </div>
                </div>

                <div>
                    <label for="parking-price" class="block text-xs font-bold text-slate-600 mb-1">車位價格 (萬元)</label>
                    <input type="text" 
                           inputmode="decimal" 
                           pattern="[0-9]*[.]?[0-9]*" 
                           id="parking-price" 
                           value="150" 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                           oninput="handleNumericInput(this); calculate();">
                </div>

                <div>
                    <label for="parking-area" class="block text-xs font-bold text-slate-600 mb-1">車位坪數 (坪)</label>
                    <input type="text" 
                           inputmode="decimal" 
                           pattern="[0-9]*[.]?[0-9]*" 
                           id="parking-area" 
                           placeholder="坪數" 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                           oninput="handleNumericInput(this); calculate();">
                </div>
            </div>

            <!-- 5. 計算結果卡片（黑底黃字高對比設計） -->
            <div class="mt-4 p-4 rounded-xl bg-gradient-to-br from-slate-900 to-blue-950 text-white shadow-lg space-y-3">
                <div class="flex items-baseline justify-between border-b border-slate-700/80 pb-2">
                    <span class="text-xs text-slate-300 tracking-wider uppercase font-semibold">扣車位每坪單價</span>
                    <span class="text-xs text-yellow-400 font-medium" id="calc-hint">輸入總價與坪數開始計算</span>
                </div>

                <div class="text-center py-1">
                    <div class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white flex items-center justify-center">
                        <span id="unit-price" class="text-amber-400 mr-1.5">0.00</span>
                        <span class="text-sm font-medium text-slate-300">萬/坪</span>
                    </div>
                </div>

                <!-- 拆算明細 -->
                <div class="grid grid-cols-2 gap-2 text-xs pt-1 border-t border-slate-700/80 text-slate-300">
                    <div>淨總價：<span id="net-price" class="font-bold text-white">0</span> 萬</div>
                    <div>淨坪數：<span id="net-area" class="font-bold text-white">0.00</span> 坪</div>
                </div>
            </div>

            <!-- 複製摘要按鈕 -->
            <button type="button" onclick="copyResult()" id="btn-copy" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm flex items-center justify-center shadow-md active:scale-[0.99] transition">
                <i class="fa-regular fa-copy mr-2"></i> 一鍵複製試算結果傳 LINE
            </button>

            <!-- 複製成功提示 -->
            <div id="copy-toast" class="hidden text-center text-xs font-bold text-emerald-600 bg-emerald-50 py-1.5 rounded-lg border border-emerald-200">
                <i class="fa-solid fa-check mr-1"></i> 已複製至剪貼簿，可直接貼上傳給客戶！
            </div>

        </div>
    </main>

    <!-- 頁尾說明 -->
    <footer class="text-center py-3 text-xs text-slate-400">
        算式：(總價 - 車位價) ÷ (總坪數 - 車位坪數) = 每坪單價
    </footer>

    <!-- 邏輯腳本 -->
    <script>
        // 大樓社區車位資料庫（完整保留）
        const buildingsData = [
            { name: "聯上康橋", types: [{ label: "平面車位", area: 8.36 }] },
            { name: "良勳夢公園 / 年年如意66夢公園", types: [{ label: "平面車位", area: 9.15 }] },
            { name: "永龍V&A", types: [{ label: "平面車位", area: 7.35 }, { label: "大平面", area: 8.55 }] },
            { name: "永龍V&A2", types: [{ label: "平面車位", area: 7.74 }, { label: "子母車位", area: 12.34 }] },
            { name: "明水森林", types: [{ label: "平面車位", area: 10.8 }, { label: "子母車位", area: 16.2 }] },
            { name: "仁發總圖匯", types: [{ label: "平面車位", area: 6.07 }, { label: "大平面", area: 6.95 }] },
            { name: "三發匯世界", types: [{ label: "平面車位", area: 5.82 }, { label: "小平面", area: 5.15 }] },
            { name: "綠海都心", types: [{ label: "平面車位", area: 10.41 }] },
            { name: "東橋真愛", types: [{ label: "平面車位", area: 6.77 }, { label: "小平面", area: 6.2 }] },
            { name: "水舞紀", types: [{ label: "平面車位", area: 7.94 }] },
            { name: "仁發大都匯", types: [{ label: "平面車位", area: 6.66 }, { label: "小平面", area: 6.04 }] },
            { name: "三發橋", types: [{ label: "平面車位", area: 8.33 }] },
            { name: "其他 / 自訂大樓", types: [{ label: "自訂規格", area: 8.0 }] }
        ];

        let currentParkingType = 'plane'; // 'plane' or 'mechanical'
        let currentBuilding = buildingsData[0];
        let currentSelectedSubIndex = 0;

        // 手機輸入過濾防呆（只保留數字與唯一小數點）
        function handleNumericInput(el) {
            el.value = el.value.replace(/[^0-9.]/g, '');
            const parts = el.value.split('.');
            if (parts.length > 2) {
                el.value = parts[0] + '.' + parts.slice(1).join('');
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            initBuildingSelect();
            setParkingType('plane');
            onBuildingChange(0);
        });

        // 建立大樓下拉清單
        function initBuildingSelect() {
            const select = document.getElementById('building-select');
            select.innerHTML = '';
            buildingsData.forEach((b, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = b.name;
                select.appendChild(opt);
            });

            select.addEventListener('change', (e) => {
                onBuildingChange(parseInt(e.target.value));
            });
        }

        // 大樓變更時更新子規格按鈕與預設坪數
        function onBuildingChange(index) {
            currentBuilding = buildingsData[index];
            currentSelectedSubIndex = 0;
            renderSubParkingButtons();
            applyParkingArea(currentBuilding.types[0].area);
        }

        // 渲染車位規格子按鈕（如：大平面、小平面、子母）
        function renderSubParkingButtons() {
            const container = document.getElementById('sub-parking-buttons');
            container.innerHTML = '';

            currentBuilding.types.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = idx === currentSelectedSubIndex 
                    ? "px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm border border-blue-600"
                    : "px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-300";
                btn.innerHTML = `${item.label} (${item.area}坪)`;
                btn.onclick = () => {
                    currentSelectedSubIndex = idx;
                    renderSubParkingButtons();
                    applyParkingArea(item.area);
                };
                container.appendChild(btn);
            });
        }

        // 填入車位坪數並重新計算
        function applyParkingArea(area) {
            document.getElementById('parking-area').value = area;
            calculate();
        }

        // 切換平面或機械車位 (平面 150萬 / 機械 100萬)
        function setParkingType(type) {
            currentParkingType = type;
            const btnPlane = document.getElementById('btn-plane');
            const btnMech = document.getElementById('btn-mechanical');
            const priceInput = document.getElementById('parking-price');

            if (type === 'plane') {
                btnPlane.className = "flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition shadow-sm bg-blue-50 border-blue-500 text-blue-700";
                btnMech.className = "flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition bg-white border-slate-200 text-slate-600 hover:bg-slate-50";
                priceInput.value = 150;
            } else {
                btnMech.className = "flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition shadow-sm bg-blue-50 border-blue-500 text-blue-700";
                btnPlane.className = "flex items-center justify-center py-2.5 px-3 rounded-xl border-2 font-bold text-sm transition bg-white border-slate-200 text-slate-600 hover:bg-slate-50";
                priceInput.value = 100;
            }
            calculate();
        }

        // 核心計算
        function calculate() {
            const totalPrice = parseFloat(document.getElementById('total-price').value);
            const totalArea = parseFloat(document.getElementById('total-area').value);
            const parkingPrice = parseFloat(document.getElementById('parking-price').value) || 0;
            const parkingArea = parseFloat(document.getElementById('parking-area').value) || 0;

            const unitPriceEl = document.getElementById('unit-price');
            const netPriceEl = document.getElementById('net-price');
            const netAreaEl = document.getElementById('net-area');
            const hintEl = document.getElementById('calc-hint');

            if (isNaN(totalPrice) || isNaN(totalArea) || totalArea <= 0) {
                unitPriceEl.textContent = "0.00";
                netPriceEl.textContent = "0";
                netAreaEl.textContent = "0.00";
                hintEl.textContent = "輸入總價與坪數開始計算";
                return;
            }

            const netPrice = totalPrice - parkingPrice;
            const netArea = totalArea - parkingArea;

            netPriceEl.textContent = netPrice.toFixed(1).replace(/\.0$/, '');
            netAreaEl.textContent = netArea.toFixed(2);

            if (netArea <= 0) {
                unitPriceEl.textContent = "0.00";
                hintEl.textContent = "總坪數須大於車位坪數";
                return;
            }

            const unitPrice = netPrice / netArea;
            unitPriceEl.textContent = unitPrice.toFixed(2);
            hintEl.textContent = "拆算完成";
        }

        // 一鍵複製試算明細傳 LINE
        function copyResult() {
            const buildingName = currentBuilding.name;
            const totalPrice = document.getElementById('total-price').value || '0';
            const totalArea = document.getElementById('total-area').value || '0';
            const parkingPrice = document.getElementById('parking-price').value || '0';
            const parkingArea = document.getElementById('parking-area').value || '0';
            const pType = currentParkingType === 'plane' ? '平面車位' : '機械車位';
            const subLabel = currentBuilding.types[currentSelectedSubIndex]?.label || '';
            const unitPrice = document.getElementById('unit-price').textContent;
            const netPrice = document.getElementById('net-price').textContent;
            const netArea = document.getElementById('net-area').textContent;

            const text = `【${buildingName}】房屋單價試算：\n` +
                         `• 總價：${totalPrice} 萬（總坪數：${totalArea} 坪）\n` +
                         `• 車位：${pType} (${subLabel}) ${parkingPrice} 萬 / ${parkingArea} 坪\n` +
                         `------------------------\n` +
                         `• 淨總價：${netPrice} 萬\n` +
                         `• 淨建坪：${netArea} 坪\n` +
                         `👉 扣車位每坪單價：${unitPrice} 萬/坪`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast();
        }

        function showToast() {
            const toast = document.getElementById('copy-toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
